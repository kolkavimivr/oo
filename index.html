<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת תעבורה ונקודות קצה (Vercel Endpoint Tester)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #1a252f;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .status-badge {
      margin-top: 15px;
      font-weight: bold;
      font-size: 15px;
    }
    .status-200 { color: #16a34a; }
    .status-error { color: #dc2626; }
    pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      max-height: 250px;
      font-size: 13px;
      direction: ltr;
      text-align: left;
    }
    .preview-container {
      margin-top: 25px;
    }
    iframe {
      width: 100%;
      height: 450px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>בדיקת תעבורה ונקודות קצה (Vercel Endpoint Tester)</h1>

  <div class="form-group">
    <label for="endpoint">כתובת ה-API לבדיקה:</label>
    <input type="text" id="endpoint" value="api/proxy?url=https://example.com" placeholder="למשל: api/proxy?url=https://example.com">
  </div>

  <div class="form-group">
    <label for="method">שיטת שליחה (Method):</label>
    <select id="method">
      <option value="GET">GET</option>
      <option value="POST">POST</option>
    </select>
  </div>

  <button onclick="sendRequest()">שלח בקשה לבדיקה</button>

  <div id="statusContainer" class="status-badge"></div>

  <label style="margin-top: 15px;">תגובת השרת (Raw Response):</label>
  <pre id="responseOutput">תוצאות הבדיקה יופיעו כאן...</pre>

  <div class="preview-container">
    <label>תצוגה מקדימה מרונדרת (HTML Preview):</label>
    <iframe id="previewFrame"></iframe>
  </div>
</div>

<script>
  async function sendRequest() {
    const endpointInput = document.getElementById('endpoint').value.trim();
    const method = document.getElementById('method').value;
    const statusContainer = document.getElementById('statusContainer');
    const responseOutput = document.getElementById('responseOutput');
    const previewFrame = document.getElementById('previewFrame');

    statusContainer.innerHTML = 'שולח בקשה...';
    responseOutput.textContent = 'טוען...';
    previewFrame.srcdoc = '<html><body style="font-family:sans-serif; text-align:center; padding-top:50px; color:#666;">טוען תצוגה מקדימה...</body></html>';

    const startTime = performance.now();

    try {
      const response = await fetch('/' + endpointInput, { method: method });
      const duration = Math.round(performance.now() - startTime);

      const contentType = response.headers.get('content-type') || '';
      const text = await response.text();

      // עדכון הסטטוס
      if (response.ok) {
        statusContainer.className = 'status-badge status-200';
        statusContainer.textContent = `סטטוס: ${response.status} OK (${duration}ms)`;
      } else {
        statusContainer.className = 'status-badge status-error';
        statusContainer.textContent = `סטטוס: ${response.status} (${duration}ms)`;
      }

      // הצגת התגובה בתיבת ה-Raw
      responseOutput.textContent = text;

      // הזרקת ה-HTML אל ה-iframe כדי להציג את האתר בצורה ויזואלית ומסודרת
      previewFrame.srcdoc = text;

    } catch (error) {
      statusContainer.className = 'status-badge status-error';
      statusContainer.textContent = 'שגיאת תקשורת';
      responseOutput.textContent = 'אירעה שגיאה בביצוע הבקשה:\n' + error.message;
      previewFrame.srcdoc = '<html><body style="font-family:sans-serif; text-align:center; padding-top:50px; color:red;">שגיאה בטעינת התצוגה המקדימה</body></html>';
    }
  }
</script>

</body>
</html>
