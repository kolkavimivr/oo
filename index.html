<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת תעבורה ונקודות קצה (Vercel Endpoint Tester)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #0f172a;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #334155;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .status-badge {
      margin-top: 15px;
      font-weight: bold;
      font-size: 15px;
    }
    .status-200 { color: #16a34a; }
    .status-error { color: #dc2626; }
    pre {
      background: #0f172a;
      color: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      max-height: 200px;
      font-size: 13px;
      direction: ltr;
      text-align: left;
    }
    .preview-container {
      margin-top: 25px;
    }
    iframe {
      width: 100%;
      height: 650px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>בדיקת תעבורה ונקודות קצה (Vercel Endpoint Tester)</h1>

  <div class="form-group">
    <label for="targetUrlInput">כתובת אתר היעד להצגה:</label>
    <input type="text" id="targetUrlInput" value="https://example.com" placeholder="הכנס כתובת מלאה, למשל: https://example.com או קישור YouTube">
  </div>

  <button onclick="runProxy()">טען אתר דרך ה-Proxy</button>

  <div id="statusContainer" class="status-badge"></div>

  <label style="margin-top: 15px;">תגובת השרת הגולמית (Raw Data):</label>
  <pre id="responseOutput">תוצאות הבדיקה יופיעו כאן...</pre>

  <div class="preview-container">
    <label>תצוגת אתר מעובדת (HTML Preview):</label>
    <iframe id="previewFrame"></iframe>
  </div>
</div>

<script>
  async function loadUrlThroughProxy(targetUrl) {
    const statusContainer = document.getElementById('statusContainer');
    const responseOutput = document.getElementById('responseOutput');
    const previewFrame = document.getElementById('previewFrame');
    const targetInput = document.getElementById('targetUrlInput');

    targetInput.value = targetUrl;
    statusContainer.innerHTML = 'שולח בקשה ל-Proxy...';
    responseOutput.textContent = 'טוען...';

    const endpointPath = '/api/proxy?url=' + encodeURIComponent(targetUrl);
    const startTime = performance.now();

    try {
      const response = await fetch(endpointPath);
      const duration = Math.round(performance.now() - startTime);
      const text = await response.text();

      if (response.ok) {
        statusContainer.className = 'status-badge status-200';
        statusContainer.textContent = `סטטוס: ${response.status} OK (${duration}ms)`;
      } else {
        statusContainer.className = 'status-badge status-error';
        statusContainer.textContent = `סטטוס: ${response.status} (${duration}ms)`;
      }

      responseOutput.textContent = text;
      previewFrame.srcdoc = text;

      // יירוט לחיצות על קישורים פנימיים
      previewFrame.onload = () => {
        try {
          const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
          const links = iframeDoc.querySelectorAll('a');
          links.forEach(link => {
            link.addEventListener('click', (e) => {
              const href = link.getAttribute('href');
              if (href && !href.startsWith('javascript:') && !href.startsWith('#')) {
                e.preventDefault();
                const fullUrl = new URL(href, targetUrl).href;
                loadUrlThroughProxy(fullUrl);
              }
            });
          });
        } catch (err) {
          console.log('יירוט קישורים לא זמין עבור iframe זה:', err);
        }
      };

    } catch (error) {
      statusContainer.className = 'status-badge status-error';
      statusContainer.textContent = 'שגיאת תקשורת';
      responseOutput.textContent = 'אירעה שגיאה:\n' + error.message;
    }
  }

  function runProxy() {
    const targetUrl = document.getElementById('targetUrlInput').value.trim();
    if (targetUrl) {
      loadUrlThroughProxy(targetUrl);
    }
  }
</script>

</body>
</html>
