<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנגנון הצגת מדינה ואתרי אינטרנט מלאים</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-color: #ff0000;
            --text-color: #ffffff;
            --subtext-color: #aaaaaa;
            --border-color: #383838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* סרגל צד */
        sidebar {
            width: 280px;
            background-color: #121212;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 20px;
        }

        sidebar h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: var(--card-bg);
            border-color: var(--accent-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--subtext-color);
        }

        input[type="text"] {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            border-color: #3ea6ff;
        }

        button.action-btn {
            background-color: #272727;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button.action-btn:hover {
            background-color: #3f3f3f;
        }

        /* אזור תוכן מרכזי */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            gap: 20px;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
        }

        /* נגן יוטיוב */
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* יחס 16:9 */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .player-wrapper iframe, .player-wrapper #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* תוצאות חיפוש */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid transparent;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-color);
        }

        .video-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .video-card .info {
            padding: 10px;
        }

        .video-card .title {
            font-size: 0.85rem;
            font-weight: bold;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-card .channel {
            font-size: 0.75rem;
            color: var(--subtext-color);
            margin-top: 5px;
        }

        /* מנגנון אתרים חיצוניים (Proxy Iframe) */
        .web-viewer-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .web-viewer-controls {
            display: flex;
            gap: 10px;
        }

        .web-viewer-controls input {
            flex: 1;
        }

        .web-frame {
            flex: 1;
            width: 100%;
            min-height: 500px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
        }

        .status-bar {
            padding: 8px 12px;
            background-color: #1a1a1a;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--subtext-color);
        }
    </style>
</head>
<body>

    <!-- סרגל ניווט ושליטה -->
    <sidebar>
        <h2>🎬 מנגנון תצוגה מלא</h2>

        <button class="nav-btn active" onclick="switchTab('youtube-tab')">נגן YouTube אמיתי</button>
        <button class="nav-btn" onclick="switchTab('search-tab')">חיפוש YouTube API</button>
        <button class="nav-btn" onclick="switchTab('web-tab')">מעקף חסימות אתרים (Proxy)</button>

        <hr style="border-color: var(--border-color);">

        <!-- טעינה מהירה לפי URL או מזהה -->
        <div class="input-group">
            <label>הכנס קישור או ID של סרטון:</label>
            <input type="text" id="video-input" placeholder="https://www.youtube.com/watch?v=...">
            <button class="action-btn" onclick="loadVideoFromInput()">נגן סרטון</button>
        </div>

        <div class="input-group">
            <label>YouTube API Key (רשות לחיפוש):</label>
            <input type="text" id="api-key-input" placeholder="AIzaSy...">
        </div>
    </sidebar>

    <!-- אזור התוכן המרכזי -->
    <main>
        
        <!-- לשונית 1: נגן YouTube רשמי -->
        <div id="youtube-tab" class="tab-content active">
            <h3>נגן YouTube מקורי (Iframe API)</h3>
            <div class="status-bar" id="player-status">מצב: מוכן לנגן סרטונים.</div>
            
            <div class="player-wrapper">
                <div id="youtube-player"></div>
            </div>

            <div class="input-group" style="flex-direction: row; gap: 10px;">
                <button class="action-btn" onclick="player.playVideo()">הפעל</button>
                <button class="action-btn" onclick="player.pauseVideo()">השהה</button>
                <button class="action-btn" onclick="player.mute()">השתק</button>
                <button class="action-btn" onclick="player.unMute()">בטל השתקה</button>
            </div>
        </div>

        <!-- לשונית 2: חיפוש תוכן מ-YouTube API -->
        <div id="search-tab" class="tab-content">
            <h3>חיפוש תכנים בזמן אמת משרתי YouTube</h3>
            <div class="input-group" style="flex-direction: row; gap: 10px;">
                <input type="text" id="search-query" placeholder="חפש סרטון, ערוץ או נושא..." style="flex: 1;">
                <button class="action-btn" onclick="searchYouTube()">חפש ב-API</button>
            </div>
            <div id="search-results" class="results-grid"></div>
        </div>

        <!-- לשונית 3: מנגנון הצגת אתרים חיצוניים דרך Proxy -->
        <div id="web-tab" class="tab-content">
            <h3>הצגת אתרים שחוסמים Frame (דרך CORS Proxy)</h3>
            <p style="font-size: 0.85rem; color: var(--subtext-color);">
                אתרים רגילים חוסמים תצוגה ב-Iframe באמצעות כותרת X-Frame-Options. המנגנון להלן מעביר את הבקשה דרך פרוקסי שמסיר את החסימה.
            </p>
            <div class="web-viewer-container">
                <div class="web-viewer-controls">
                    <input type="text" id="web-url-input" placeholder="https://example.com">
                    <button class="action-btn" onclick="loadWebPage()">טען אתר</button>
                </div>
                <iframe id="web-frame" class="web-frame" src="about:blank"></iframe>
            </div>
        </div>

    </main>

    <!-- טעינת ה-API הרשמי של YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let isApiReady = false;

        // 1. פונקציית אתחול נגן ה-YouTube הרשמי
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: 'M7lc1UVf-VE', // סרטון דיפולטיבי להדגמה
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isApiReady = true;
            document.getElementById('player-status').innerText = "מצב: הנגן מוכן לפעולה.";
        }

        function onPlayerStateChange(event) {
            let states = {
                '-1': 'לא התחיל',
                '0': 'הסתיים',
                '1': 'מנגן כעת',
                '2': 'מושהה',
                '3': 'טוען...',
                '5': 'וידאו מוכן'
            };
            if (states[event.data]) {
                document.getElementById('player-status').innerText = "מצב: " + states[event.data];
            }
        }

        // חילוץ מזהה סרטון (Video ID) מקישורים שונים
        function extractVideoID(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        // טעינת סרטון לנגן לפי הקלט
        function loadVideoFromInput() {
            let input = document.getElementById('video-input').value.trim();
            if (!input) return;
            
            let videoId = extractVideoID(input);
            if (player && isApiReady) {
                player.loadVideoById(videoId);
                switchTab('youtube-tab');
            } else {
                alert("הנגן עדיין בלבישת אתחול, אנא נסה שוב עוד רגע.");
            }
        }

        // 2. חיפוש תכנים באמצעות YouTube Data API v3
        async function searchYouTube() {
            let apiKey = document.getElementById('api-key-input').value.trim();
            let query = document.getElementById('search-query').value.trim();

            if (!apiKey) {
                alert("כדי לחפש בשרתי YouTube בזמן אמת, יש להזין YouTube Data API Key בסרגל הצידי.");
                return;
            }
            if (!query) return;

            let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${apiKey}`;

            try {
                let res = await fetch(url);
                let data = await res.json();

                if (data.error) {
                    alert("שגיאת API: " + data.error.message);
                    return;
                }

                let container = document.getElementById('search-results');
                container.innerHTML = '';

                data.items.forEach(item => {
                    let card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => {
                        player.loadVideoById(item.id.videoId);
                        switchTab('youtube-tab');
                    };
                    card.innerHTML = `
                        <img src="${item.snippet.thumbnails.medium.url}" alt="thumbnail">
                        <div class="info">
                            <div class="title">${item.snippet.title}</div>
                            <div class="channel">${item.snippet.channelTitle}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                alert("שגיאה בחיבור ל-API: " + err.message);
            }
        }

        // 3. טעינת אתרים חיצוניים דרך Proxy למעקף X-Frame-Options
        function loadWebPage() {
            let url = document.getElementById('web-url-input').value.trim();
            if (!url) return;

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // שימוש בשרת Proxy ציבורי המוריד כותרות חסימה (ניתן להחליף בשרת Proxy פרטי)
            let proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(url);
            
            document.getElementById('web-frame').src = proxyUrl;
        }

        // מעבר בין לשוניות
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            
            let btnIndex = tabId === 'youtube-tab' ? 0 : (tabId === 'search-tab' ? 1 : 2);
            document.querySelectorAll('.nav-btn')[btnIndex].classList.add('active');
        }
    </script>
</body>
</html>
