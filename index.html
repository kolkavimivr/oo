<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בדיקת תעבורת API ושרתי אירוח</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 650px;
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: #0f172a;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .response-container {
            margin-top: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        pre {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            overflow-x: auto;
            max-height: 250px;
            direction: ltr;
            text-align: left;
        }

        .status-success { color: var(--success-color); }
        .status-error { color: var(--error-color); }
    </style>
</head>
<body>

<div class="container">
    <h1>בדיקת תעבורה ונקודות קצה (Vercel Endpoint Tester)</h1>
    
    <div class="form-group">
        <label for="endpoint">כתובת ה-API לבדיקה:</label>
        <input type="text" id="endpoint" value="/api/check" placeholder="הכנס כתובת מלאה או יחסית">
    </div>

    <div class="form-group">
        <label for="method">שיטת שליחה (Method):</label>
        <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
        </select>
    </div>

    <button onclick="sendRequest()">שלח בקשה לבדיקה</button>

    <div class="response-container">
        <div class="status-bar">
            <span>תגובת השרת:</span>
            <span id="statusCode"></span>
        </div>
        <pre id="output">// התוצאות יופיעו כאן לאחר ביצוע הבקשה...</pre>
    </div>
</div>

<script>
    async function sendRequest() {
        const endpoint = document.getElementById('endpoint').value;
        const method = document.getElementById('method').value;
        const output = document.getElementById('output');
        const statusCode = document.getElementById('statusCode');

        output.textContent = "מבצע פנייה לשרת...";
        statusCode.textContent = "";
        statusCode.className = "";

        const startTime = performance.now();

        try {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            if (method === 'POST') {
                options.body = JSON.stringify({
                    timestamp: new Date().toISOString(),
                    clientInfo: "Vercel Traffic Test"
                });
            }

            const response = await fetch(endpoint, options);
            const endTime = performance.now();
            const duration = Math.round(endTime - startTime);

            statusCode.textContent = `סטטוס: ${response.status} ${response.statusText} (${duration}ms)`;
            statusCode.className = response.ok ? 'status-success' : 'status-error';

            let data;
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                data = await response.json();
            } else {
                data = await response.text();
            }

            const resultObj = {
                status: response.status,
                headers: Object.fromEntries(response.headers.entries()),
                body: data
            };

            output.textContent = JSON.stringify(resultObj, null, 2);

        } catch (error) {
            statusCode.textContent = "שגיאת תקשורת";
            statusCode.className = 'status-error';
            output.textContent = JSON.stringify({
                error: error.message,
                details: "לא ניתן היה להשלים את החיבור לשרת היעד. ייתכן שהשרת אינו זמין או שהחיבור נחסם."
            }, null, 2);
        }
    }
</script>

</body>
</html>
